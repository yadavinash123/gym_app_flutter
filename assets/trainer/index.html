<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; worker-src 'none';"><title>FitForge 3D trainer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c28;color:#eff7fa;font:14px system-ui,sans-serif}button,select,input{font:inherit}button,select{border:1px solid #405867;border-radius:12px;background:#1c2d3b;color:#eff7fa;min-height:44px;padding:9px 12px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c0ff57;outline-offset:2px}button:disabled{opacity:.4}button[aria-pressed=true],.primary{background:#62e4db;color:#082321;border-color:#62e4db}#stage{height:340px;position:relative;background:radial-gradient(ellipse at 50% 75%,#1b5060 0%,#132c3b 48%,#101c28 78%)}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;background:#101c28}#status:empty{display:none}.overlay{position:absolute;left:16px;right:16px;top:14px;pointer-events:none;display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:1.3px;color:#78ded9}.gesture{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#aecad1;font-size:12px;pointer-events:none}.controls{padding:12px 14px 16px;display:grid;gap:10px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.phase{text-align:center;color:#e0f6f5;min-height:20px}.note{margin:0;color:#b5c7ce;font-size:12px;line-height:1.5}input[type=range]{width:100%;accent-color:#62e4db;min-height:30px}label{display:flex;gap:6px;align-items:center}.small{font-size:12px}.toggle{accent-color:#62e4db}#muscle-note{color:#62e4db}.error{color:#ffb9bd}#selection{min-height:17px;text-align:center;font-size:12px;color:#62e4db}
</style></head><body>
<div id="stage" role="img" aria-label="Rotatable 3D push-up demonstration. Drag to rotate; use the view buttons or zoom controls for keyboard access."><div class="overlay"><span>FITFORGE / 3D STUDIO</span><span>OFFLINE MODEL</span></div><div class="gesture">Drag to rotate · Pinch to zoom</div><div id="status" role="status">Preparing 3D viewer…</div></div>
<div class="controls"><div class="phase" id="phase" aria-live="off">Loading movement</div><input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Animation position" disabled>
<div class="row"><button id="play" class="primary" disabled>Play</button><button id="replay" disabled>Replay</button><label>Speed<select id="speed" disabled><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label><input id="loop" class="toggle" type="checkbox" checked disabled>Loop</label></div>
<div class="row" aria-label="Camera views"><button data-view="front" disabled>Front</button><button data-view="side" disabled>Side</button><button data-view="back" disabled>Back</button><button id="zoom-in" aria-label="Zoom in" disabled>＋</button><button id="zoom-out" aria-label="Zoom out" disabled>−</button></div>
<div class="row"><label><input id="highlight" class="toggle" type="checkbox" disabled>Muscle emphasis</label><button id="fullscreen" disabled>Fullscreen</button></div><div id="selection" role="status"></div><p id="muscle-note" class="note" hidden>Colored regions are approximate surface emphasis, not measured muscle activation.</p><p id="motion-note" class="note">Animated anatomical model · Technical preview. Independent technique review is pending.</p></div>
<script src="viewer.js"></script></body></html>
